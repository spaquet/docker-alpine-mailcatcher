version: "3.9" # optional since v1.27.0

services:
  mailcatcher:
    container_name: mailcatcher
    restart: on-failure:10
    # build: . # if building from source
    image: stpaquet/alpinemailcatcher:latest # or any other image you want to use
    environment:
      - MAIL_LIMIT=70 # docker image default is 50
      - TIMEZONE=America/Los_Angeles # docker image default is UTC
    ports:
    - "1080:1080"
    - "1025:1025"
    # Uncomment the following section to enable persistent message storage
    # volumes:
    #   - mailcatcher-data:/home/mailcatcher/.mailcatcher
    # command: sh -c "mailcatcher --foreground --smtp-port=1025 --http-port=1080 --ip=0.0.0.0 --messages-limit=$$MAIL_LIMIT --persistence"

# Uncomment the following section when enabling persistence
# volumes:
#   mailcatcher-data: