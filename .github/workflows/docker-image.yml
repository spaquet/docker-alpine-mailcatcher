name: Docker Image CI

on:
  push:
    branches: [ master ]
    tags:
      - 'v*.*.*'
    paths:
      - .github/workflows/docker-image.yml
      - '!**.md'
      - '!.github/workflows/update-description.yml'

env:
  TEST_TAG: user/myapp:test


jobs:

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        thread:
          - { name: "Thread 1: amd64", platforms: "linux/amd64" }
          - { name: "Thread 2: arm64", platforms: "linux/arm64" }
          - { name: "Thread 3: 386,arm/v7,arm/v6", platforms: "linux/386,linux/arm/v7,linux/arm/v6" }
      max-parallel: 3

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@master
      with:
        platforms: all

    # - name: Build and export to Docker
    #   uses: docker/build-push-action@v2
    #   with:
    #     context: .
    #     load: true
    #     tags: ${{ env.TEST_TAG }}

    # - name: Test
    #   run: |
    #     docker run --rm ${{ env.TEST_TAG }}

    - name: Build and push - ${{ matrix.thread.name }}
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: ${{ matrix.thread.platforms }}
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/alpinemailcatcher:latest
        build-args: |
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}

